# =============================================================================
# nginx.conf – configuração do servidor do frontend
# -----------------------------------------------------------------------------
# O que faz:
#   1) Serve a página estática (index.html).
#   2) Funciona como PROXY INVERSO: tudo o que chega a /api/ é reencaminhado
#      para a API, dentro da rede do Compose.
#
# Porque um proxy inverso?
#   - O browser só fala com um endereço (o do nginx), por isso não há problemas
#     de CORS (bloqueio de pedidos entre origens diferentes).
#   - A API deixa de precisar de estar exposta ao exterior (mais segurança).
#   - É a mesma ideia do Ingress/Load Balancer que vamos usar no Kubernetes e na AWS.
#
# Passo 6, Parte E: o nome da API passa a ser resolvido a CADA pedido (e não
# só ao arrancar). Antes, se o DNS ainda não estivesse pronto quando o nginx
# arrancava (por exemplo depois de reiniciar o Docker), o nginx falhava com
# "host not found in upstream" e o Pod ficava em CrashLoopBackOff.
#
# Este ficheiro é um TEMPLATE (vai para /etc/nginx/templates/ no Dockerfile).
# No arranque, a imagem substitui ${NGINX_LOCAL_RESOLVERS} pelo servidor DNS
# que o próprio contentor usa (lido de /etc/resolv.conf). Assim o mesmo
# ficheiro serve no Compose e no Kubernetes, sem endereços escritos à mão.
# =============================================================================

server {
    # Porta 8080 (e não 80): a imagem "unprivileged" corre sem ser root, e um
    # utilizador sem privilégios não pode usar portas abaixo de 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Endereço de saúde do próprio nginx (usado pelo HEALTHCHECK do Dockerfile).
    location = /healthz {
        access_log off;                       # não encher os logs com health checks
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Servidor DNS a usar para resolver o nome da API em tempo de execução.
    # valid=10s: guarda a resposta só 10 s, para acompanhar mudanças de IP
    # (os Pods mudam de IP quando são recriados).
    # ipv6=off: só pede endereços IPv4 (o cluster não usa IPv6).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # Reencaminha /api/qualquer-coisa para http://api:8000/qualquer-coisa
    # - ${API_HOST} é o nome do serviço da API. Vem de uma variável de ambiente
    #   porque o nome certo é diferente em cada sítio:
    #     Compose:     api
    #     Kubernetes:  api.loja.svc.cluster.local  (nome COMPLETO)
    #   Porquê o nome completo no Kubernetes? Quando o nginx resolve em tempo
    #   de execução NÃO usa os "domínios de pesquisa" do /etc/resolv.conf, por
    #   isso o nome curto "api" falha (o DNS do cluster não o conhece sozinho).
    # - Com o nome numa VARIÁVEL, o nginx só o resolve quando chega um pedido.
    #   O custo: com variável o nginx deixa de remover o prefixo /api sozinho,
    #   por isso o "rewrite" faz esse trabalho (o "break" impede que o pedido
    #   seja reavaliado noutra location).
    location /api/ {
        set $api_upstream http://${API_HOST}:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tudo o resto: ficheiros estáticos, ou 404 se não existirem.
    location / {
        try_files $uri $uri/ =404;
    }
}