# =============================================================================
# aplicacao-sealed-secrets.yaml  (k8s/argocd)
# -----------------------------------------------------------------------------
# O QUE FAZ: manda o ArgoCD instalar o controlador do Sealed Secrets no cluster,
#            a partir do Helm chart oficial (um "pacote" de manifests).
# PORQUÊ:    o Secret "db-credenciais" não pode estar no Git em texto simples.
#            Com o Sealed Secrets, o segredo é encriptado com uma chave pública
#            e guardado no Git como "SealedSecret"; só o controlador, que tem a
#            chave privada, o consegue transformar de novo num Secret normal.
#
# Instalar o controlador com uma Application (e não à mão com "helm install")
# mantém tudo descrito no Git, como o resto da plataforma.
#
# Aplica-se uma única vez:
#   kubectl apply -f k8s/argocd/aplicacao-sealed-secrets.yaml
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default

  # DE ONDE vem: um repositório de Helm charts (e não uma pasta do Git).
  source:
    # Endereço do repositório de charts do Sealed Secrets. O projeto mudou de
    # organização no GitHub; se este endereço der erro no ArgoCD, a alternativa
    # é https://bitnami-labs.github.io/sealed-secrets
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    # "2.*" aceita qualquer versão 2.x do chart. Fica abaixo da 3.x, que pode
    # trazer alterações incompatíveis. (Em produção fixava-se uma versão exata.)
    targetRevision: "2.*"
    helm:
      releaseName: sealed-secrets
      # Valores que alteram o chart.
      valuesObject:
        # Dá ao controlador o nome "sealed-secrets-controller". É o nome que o
        # "kubeseal" procura por omissão, por isso não é preciso indicá-lo.
        fullnameOverride: sealed-secrets-controller

  # PARA ONDE vai: o namespace "kube-system", onde o kubeseal espera encontrá-lo.
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
