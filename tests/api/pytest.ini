# pytest.ini – configuração do pytest para os testes da API (Passo 7)
#
# O que faz: dá ao pytest as opções por omissão, para não teres de as escrever
# a cada execução.
# Onde corre: o pytest procura este ficheiro na pasta onde o lanças (tests/api).

[pytest]
# Onde procurar testes: nesta pasta.
testpaths = .

# -ra: no fim, mostra um resumo de tudo o que NÃO passou (falhas, saltos).
# --strict-markers: um marcador mal escrito (@pytest.mark.fumoo) dá erro em vez
#                   de ser ignorado em silêncio.
addopts = -ra --strict-markers

# Marcadores: etiquetas para escolher que testes correr
# (ex.: "pytest -m fumo" corre só os testes de fumo).
markers =
    fumo: verificação rápida de que a API está viva e responde
    funcional: comportamento esperado da API (caminho feliz e erros)
    validacao: dados inválidos e casos limite
